name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test tests/Jellyfin.Plugin.ThunderSubtitle.Tests/Jellyfin.Plugin.ThunderSubtitle.Tests.csproj -c Release

      - name: Package
        shell: pwsh
        run: ./build.ps1 -Configuration Release -Dotnet dotnet

      - name: Upload package to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/thunder-subtitle_*.zip
          fail_on_unmatched_files: true
