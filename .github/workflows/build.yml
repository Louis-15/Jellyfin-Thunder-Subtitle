name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test tests/Jellyfin.Plugin.ThunderSubtitle.Tests/Jellyfin.Plugin.ThunderSubtitle.Tests.csproj -c Release

      - name: Package
        shell: pwsh
        run: ./build.ps1 -Configuration Release -Dotnet dotnet

      - name: Write and commit the manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # manifest.json 是脚本生成的产物，不是手写内容。
          # 先在 main 的最新提交上切分支再生成，而不是在 tag 的 detached HEAD 上
          # 提交后 rebase：后者一旦 main 在此期间前进必然 CONFLICT（改的是同一批行）。
          git fetch origin main
          git checkout -B manifest-update origin/main

          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $zip = "artifacts/thunder-subtitle_$version.zip"
          if (-not (Test-Path $zip)) { throw "missing $zip" }
          $checksum = (Get-FileHash $zip -Algorithm MD5).Hash.ToLowerInvariant()
          $changelog = (git tag -l --format='%(contents)' $env:GITHUB_REF_NAME | Out-String).Trim()
          ./scripts/update-manifest.ps1 `
            -Version $version `
            -Checksum $checksum `
            -Changelog $changelog `
            -SourceUrl "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$version/thunder-subtitle_$version.zip"

          if (-not (git status --porcelain manifest.json)) {
            Write-Host "manifest.json already up to date"
            exit 0
          }
          git add manifest.json
          git commit -m "Update manifest for $env:GITHUB_REF_NAME"
          git push origin HEAD:main

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/thunder-subtitle_*.zip
          fail_on_unmatched_files: true